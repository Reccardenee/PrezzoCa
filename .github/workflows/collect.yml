name: Collect

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(data): aggiornamento prezzi automatico"
          commit_user_name: "PrezziCa Bot"
          commit_user_email: "bot@prezzica.it"

      - name: Trigger deploy
        if: steps.auto_commit.outputs.changes_detected == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
