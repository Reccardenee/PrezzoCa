name: Collect

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes_detected: ${{ steps.auto_commit.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "feat(data): aggiornamento prezzi automatico"
          commit_user_name: "PrezziCa Bot"
          commit_user_email: "bot@prezzica.it"

  trigger_deploy:
    needs: collect
    if: needs.collect.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger deploy
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
